services:
  - type: web
    name: agrodistrib
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn agrodistrib.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "True"
      - key: SECRET_KEY
        generateValue: true
