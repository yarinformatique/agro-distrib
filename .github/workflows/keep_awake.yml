name: Anti-Mise en Veille & Haute Disponibilité 24/7

on:
  schedule:
    # Maintient l'application éveillée et pré-chauffée toutes les 10 minutes pendant les heures d'activité (05h00 à 23h00 UTC)
    # Zéro délai au chargement (pas de cold-start), réactivité instantanée pour les livreurs et promotrices
    - cron: '*/10 5-23 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping des plateformes de production (/healthz)
        run: |
          echo "1. Ping Vercel Production..."
          curl -fsSL --max-time 15 "https://agro-distrib.vercel.app/healthz" || echo "Vercel ping completed"
          
          echo "2. Ping Render de secours..."
          curl -fsSL --max-time 15 "https://agro-distrib-1.onrender.com/healthz" || echo "Render ping completed"
          
          echo "Système maintenu en éveil et opérationnel sans interruption."
